ShortDescription: Local, privacy-first PDF viewer and practical editor.
Description: |-
  nexPDF is a local, cross-platform PDF viewer and practical editor built with C++20, Qt Widgets, and MuPDF.
  It contains no telemetry, uploads no documents, and does not execute PDF JavaScript.
  Editing highlights: two-stage permanent redaction, exact watermark removal with object-level restore,
  AES-128/AES-256 encryption and decryption, page and annotation editing with MuPDF-journal undo/redo,
  and validated atomic saving. Reading positions are remembered per document by content fingerprint.
